databases:
  # ==========================================
  # 1. PostgreSQL Database
  # ==========================================
  - name: streamdocs-db
    plan: free
    databaseName: documents
    region: ohio

services:
  # ==========================================
  # 2. Redis (for Celery Queue & Progress Events)
  # ==========================================
  - type: redis
    name: streamdocs-redis
    plan: free
    region: ohio
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # ==========================================
  # 3. Backend API + Celery Worker (Combined)
  # ==========================================
  - type: web
    name: streamdocs-api
    env: docker
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/utils/health-check/
    dockerCommand: "/app/start.sh"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: StreamDocs
      - key: DATABASE_URL
        fromDatabase:
          name: streamdocs-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: streamdocs-redis
          property: connectionString
      # Allow all CORS in production since frontend hostname is generated dynamically
      - key: BACKEND_CORS_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: FIRST_SUPERUSER
        value: admin@streamdocs.com
      - key: FIRST_SUPERUSER_PASSWORD
        generateValue: true

  # ==========================================
  # 4. Frontend (React + Vite Static Site)
  # ==========================================
  - type: web
    name: streamdocs-frontend
    env: static
    # Prepend https:// since Render's 'host' property omits the protocol
    buildCommand: "cd frontend && npm install && VITE_API_URL=https://$VITE_API_URL npm run build"
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: streamdocs-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
