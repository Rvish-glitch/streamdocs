services:
  db:
    ports:
      - "${POSTGRES_PORT}:5432"

  redis:
    ports:
      - "6379:6379"

  adminer:
    ports:
      - "8080:8080"

  backend:
    ports:
      - "8000:8000"
    command: fastapi dev --reload --host 0.0.0.0 --port 8000 app/main.py
    volumes:
      - ./app:/app/app
      - ./data:/app/data

  worker:
    volumes:
      - ./app:/app/app
      - ./data:/app/data

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1081:1080"
      - "1026:1025"

networks:
  traefik-public:
    # For local dev, don't expect an external Traefik network
    external: false
